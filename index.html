<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>十五格斗-测试版v1.4</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
        body { background: #1a1a2e; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: "Microsoft YaHei", sans-serif; overflow: hidden; }
        
        #game-container { position: relative; width: 100%; max-width: 1200px; height: 100vh; max-height: 800px; aspect-ratio: 16/9; overflow: hidden; background: #000; }
        canvas { width: 100%; height: 100%; display: block; }

        /* ==================== 选人界面 CSS ==================== */
        #select-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #2b1b54, #4b1b73);
            display: flex; flex-direction: column; color: white; z-index: 50; transition: opacity 0.3s;
        }
        .select-header { text-align: center; padding: 10px 0; }
        .select-header h1 { font-size: 28px; color: #ffd700; text-shadow: 2px 2px 0 #000; margin-bottom: 5px; }
        
        /* 提示当前是谁在选 */
        #select-turn-text { font-size: 18px; font-weight: bold; color: #00ffcc; text-shadow: 1px 1px 0 #000; margin-top: 5px; }
        
        .select-main { flex: 1; display: flex; justify-content: space-between; padding: 0 15px; overflow: hidden; }
        
        /* 左右两侧展示区 */
        .char-showcase { width: 26%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; }
        .char-name-badge { background: #ff6699; padding: 5px 15px; border-radius: 20px; font-weight: bold; border: 2px solid white; margin-bottom: 10px; font-size: 14px; white-space: nowrap; transition: background 0.3s; }
        
        /* 选人界面的全图展示框 */
        .char-img-box { width: 100%; aspect-ratio: 1/1; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.5); overflow: hidden; position: relative; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.2); }
        .char-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .char-ult { color: #ffd700; font-weight: bold; margin-top: 10px; font-size: 14px; text-shadow: 1px 1px 0 #000; text-align: center; }
        
        /* 属性条 */
        .stats-box { width: 100%; margin-top: 10px; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 10px; }
        .stat-row { display: flex; align-items: center; margin-bottom: 4px; }
        .stat-label { width: 35px; font-size: 12px; color: #aaa; }
        .stat-bar { flex: 1; height: 8px; background: #333; border-radius: 4px; overflow: hidden; display: flex; gap: 2px; }
        .stat-seg { flex: 1; background: #555; }
        .stat-seg.active { background: #00ccff; }
        .stat-seg.active.power { background: #ff3333; }
        .stat-seg.active.hp { background: #00ff00; }

        /* 中间角色列表 */
        .char-list { width: 44%; display: flex; flex-direction: column; justify-content: flex-start; gap: 8px; padding-top: 10px; }
        .char-card { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 8px; display: flex; align-items: center; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .char-card.selected-p1 { border-color: #00ccff; background: rgba(0, 204, 255, 0.2); }
        .char-card.selected-p2 { border-color: #ff3333; background: rgba(255, 51, 51, 0.2); }
        .char-avatar { width: 45px; height: 45px; border-radius: 8px; margin-right: 10px; flex-shrink: 0; overflow: hidden; }
        .char-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .char-info { flex: 1; }
        .char-title { display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; margin-bottom: 4px; }
        .char-type { color: #ffd700; font-size: 12px; }
        .char-desc { font-size: 11px; color: #ccc; line-height: 1.3; }

        .select-footer { padding: 10px; text-align: center; }
        .btn-start { background: #ffd700; color: #000; font-size: 18px; font-weight: bold; padding: 8px 40px; border-radius: 20px; border: none; cursor: pointer; box-shadow: 0 4px 0 #b38f00; }
        .btn-start:active { transform: translateY(4px); box-shadow: none; }
        .btn-start.disabled { background: #666; box-shadow: 0 4px 0 #333; color: #aaa; pointer-events: none; }

        /* ==================== 战斗界面 UI CSS ==================== */
        #battle-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: none; }
        .top-hud { display: flex; justify-content: space-between; align-items: flex-start; padding: 15px 20px 0; width: 100%; }
        .hud-player { width: 42%; display: flex; align-items: center; gap: 10px; }
        .hud-player.right { flex-direction: row-reverse; }
        .hud-avatar { width: 70px; height: 70px; border-radius: 50%; border: 3px solid white; background: #333; flex-shrink: 0; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .hud-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .hud-bars { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .hud-name { font-size: 16px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #000; }
        .hud-player.right .hud-name { text-align: right; }
        .bar-container { height: 22px; background: #333; border: 2px solid #fff; border-radius: 11px; position: relative; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .bar-hp { height: 100%; background: linear-gradient(to right, #00ff00, #8bff00); width: 100%; transition: width 0.2s; }
        .hud-player.right .bar-hp { background: linear-gradient(to left, #00ff00, #8bff00); margin-left: auto; }
        .bar-container.energy { height: 12px; border-radius: 6px; width: 80%; margin-top: 4px; }
        .hud-player.right .bar-container.energy { margin-left: auto; }
        .bar-energy { height: 100%; background: linear-gradient(to right, #00ccff, #00ffff); width: 0%; transition: width 0.1s; }
        .hud-player.right .bar-energy { background: linear-gradient(to left, #00ccff, #00ffff); margin-left: auto; }
        .timer-box { background: #ffd700; color: #000; font-size: 30px; font-weight: bold; width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 3px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.5); margin-top: 5px; }

        /* 触屏控制器 */
        #touch-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-end; padding: 20px; }
        .control-side { display: flex; align-items: flex-end; gap: 20px; pointer-events: auto; }
        
        .joystick { width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); position: relative; }
        .joy-btn { position: absolute; width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 18px; }
        .joy-btn:active { background: rgba(255,255,255,0.6); }
        .joy-up { top: 0; left: 40px; height: 35px; border-radius: 8px 8px 0 0; }
        .joy-down { bottom: 0; left: 40px; height: 35px; border-radius: 0 0 8px 8px; }
        .joy-left { top: 40px; left: 0; width: 35px; border-radius: 8px 0 0 8px; }
        .joy-right { top: 40px; right: 0; width: 35px; border-radius: 0 8px 8px 0; }

        .action-btns { display: grid; grid-template-columns: 60px 60px; grid-template-rows: 60px 60px; gap: 8px; }
        .act-btn { border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.5); }
        .act-btn:active { transform: scale(0.95); }
        .btn-block { background: rgba(0, 150, 255, 0.6); grid-area: 1 / 1; }
        .btn-atk { background: rgba(255, 50, 50, 0.6); grid-area: 2 / 2; }
        .btn-ult { background: rgba(255, 215, 0, 0.6); grid-area: 1 / 2; color: #000; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="1200" height="675"></canvas>

        <div id="battle-ui">
            <div class="top-hud">
                <div class="hud-player">
                    <div class="hud-avatar" id="p1-hud-avatar"></div>
                    <div class="hud-bars">
                        <div class="hud-name" id="p1-hud-name">P1</div>
                        <div class="bar-container"><div class="bar-hp" id="p1-hud-hp"></div></div>
                        <div class="bar-container energy"><div class="bar-energy" id="p1-hud-energy"></div></div>
                    </div>
                </div>
                <div class="timer-box">99</div>
                <div class="hud-player right">
                    <div class="hud-avatar" id="p2-hud-avatar"></div>
                    <div class="hud-bars">
                        <div class="hud-name" id="p2-hud-name">P2</div>
                        <div class="bar-container"><div class="bar-hp" id="p2-hud-hp"></div></div>
                        <div class="bar-container energy"><div class="bar-energy" id="p2-hud-energy"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="touch-controls">
            <div class="control-side">
                <div class="joystick">
                    <div class="joy-btn joy-up" data-key="KeyW">▲</div>
                    <div class="joy-btn joy-down" data-key="KeyS">▼</div>
                    <div class="joy-btn joy-left" data-key="KeyA">◀</div>
                    <div class="joy-btn joy-right" data-key="KeyD">▶</div>
                </div>
                <div class="action-btns">
                    <div class="act-btn btn-block" data-key="KeyS">防</div>
                    <div class="act-btn btn-atk" data-key="KeyJ">拍</div>
                    <div class="act-btn btn-ult" data-key="KeyK">必杀</div>
                </div>
            </div>
            <div class="control-side">
                <div class="action-btns">
                    <div class="act-btn btn-block" data-key="ArrowDown">防</div>
                    <div class="act-btn btn-atk" data-key="Numpad1">拍</div>
                    <div class="act-btn btn-ult" data-key="Numpad2">必杀</div>
                </div>
                <div class="joystick">
                    <div class="joy-btn joy-up" data-key="ArrowUp">▲</div>
                    <div class="joy-btn joy-down" data-key="ArrowDown">▼</div>
                    <div class="joy-btn joy-left" data-key="ArrowLeft">◀</div>
                    <div class="joy-btn joy-right" data-key="ArrowRight">▶</div>
                </div>
            </div>
        </div>

        <!-- 选人界面 -->
        <div id="select-screen">
            <div class="select-header">
                <h1>十五格斗</h1>
                <div id="select-turn-text">👈 P1 请选择角色</div>
            </div>
            
            <div class="select-main">
                <div class="char-showcase">
                    <div class="char-name-badge" id="p1-name-badge">辣子鸡</div>
                    <div class="char-img-box" id="p1-img-box"></div>
                    <div class="char-ult" id="p1-ult-text">必杀「曼巴冲撞」</div>
                    <div class="stats-box" id="p1-stats"></div>
                </div>

                <div class="char-list" id="char-list"></div>

                <div class="char-showcase">
                    <div class="char-name-badge" id="p2-name-badge">神秘雌性双马尾</div>
                    <div class="char-img-box" id="p2-img-box"></div>
                    <div class="char-ult" id="p2-ult-text">必杀「生理恐吓」</div>
                    <div class="stats-box" id="p2-stats"></div>
                </div>
            </div>

            <div class="select-footer">
                <button class="btn-start disabled" id="btn-start-game">按 空格 或 点击开始</button>
            </div>
        </div>
    </div>

    <script>
        const GAME_VERSION = "测试版v1.4";
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 加载抠图的缓存对象
        const ImageCache = {};

        // ==========================================
        // 1. 角色数据
        // img 用于选人界面(全图)，img_cut 用于战斗画面(抠图)
        // ==========================================
        const CHARACTERS = [
            { id: 1, name: "辣子鸡", type: "力量型", color: "#ff4d4d", img: "char1.jpg", img_cut: "char1.png", stats: { power: 5, speed: 2, hp: 4 }, ultName: "曼巴冲撞", desc: "力量型，攻击强，机动慢。往前进方向冲撞。", maxHp: 120, speed: 200, jump: -800, atkDmg: 15, ultCost: 100 },
            { id: 2, name: "迪客", type: "智慧型", color: "#4da6ff", img: "char2.jpg", img_cut: "char2.png", stats: { power: 2, speed: 3, hp: 3 }, ultName: "打电动", desc: "攻击弱，随时间变强。射出数据流束缚敌人。", maxHp: 100, speed: 300, jump: -900, atkDmg: 5, ultCost: 100 },
            { id: 3, name: "黑色神秘生物", type: "敏捷型", color: "#333333", img: "char3.jpg", img_cut: "char3.png", stats: { power: 2, speed: 5, hp: 2 }, ultName: "大狗嚼嚼嚼", desc: "机动极强，随时间削弱。锁定敌人硬控撕咬。", maxHp: 90, speed: 450, jump: -1000, atkDmg: 5, ultCost: 100 },
            { id: 4, name: "吕布", type: "力量型", color: "#cc0000", img: "char4.jpg", img_cut: "char4.png", stats: { power: 5, speed: 4, hp: 5 }, ultName: "方天画戟", desc: "各项指标极强，每10秒属性减弱。丢出画戟减对方血。", maxHp: 150, speed: 350, jump: -850, atkDmg: 20, ultCost: 100 },
            { id: 5, name: "神秘雌性双马尾", type: "精神型", color: "#ff99cc", img: "char5.jpg", img_cut: "char5.png", stats: { power: 1, speed: 1, hp: 1 }, ultName: "生理恐吓", desc: "属性低，大招耗能极低。硬控对方并夺取属性，但可被打断。", maxHp: 60, speed: 180, jump: -700, atkDmg: 3, ultCost: 40 }
        ];

        const Input = {
            keys: {}, prevKeys: {},
            init() {
                window.addEventListener('keydown', e => this.keys[e.code] = true);
                window.addEventListener('keyup', e => this.keys[e.code] = false);
                document.querySelectorAll('[data-key]').forEach(btn => {
                    const code = btn.getAttribute('data-key');
                    const press = (e) => { e.preventDefault(); this.keys[code] = true; };
                    const release = (e) => { e.preventDefault(); this.keys[code] = false; };
                    btn.addEventListener('pointerdown', press);
                    btn.addEventListener('pointerup', release);
                    btn.addEventListener('pointercancel', release);
                    btn.addEventListener('pointerleave', release);
                });
            },
            isDown(code) { return !!this.keys[code]; },
            isJustPressed(code) { return this.keys[code] && !this.prevKeys[code]; },
            update() { this.prevKeys = { ...this.keys }; }
        };
        Input.init();

        const STATE = { IDLE: 0, WALK: 1, JUMP: 2, BLOCK: 3, HIT: 4, ATTACK: 5, DEAD: 6, STUNNED: 7 };

        class Projectile {
            constructor(x, y, vx, owner, type) {
                this.x = x; this.y = y; this.vx = vx; this.owner = owner; this.type = type;
                this.width = type === 'halberd' ? 80 : 50; this.height = type === 'halberd' ? 30 : 50;
                this.active = true; this.life = 120;
            }
            update() {
                this.x += this.vx / 60; this.life--;
                if (this.life <= 0 || this.x < 0 || this.x > canvas.width) this.active = false;
            }
            getHurtbox() { return { x: this.x - this.width/2, y: this.y - this.height/2, w: this.width, h: this.height }; }
        }

        class Fighter {
            constructor(isP1, charId) {
                this.isP1 = isP1;
                this.config = CHARACTERS.find(c => c.id === charId);
                this.x = isP1 ? 350 : 850; this.y = 550; this.vx = 0; this.vy = 0;
                this.width = 120; this.height = 180; // 战斗角色占位更大一点
                this.facing = isP1 ? 1 : -1;
                this.maxHp = this.config.maxHp; this.hp = this.maxHp;
                this.energy = 0; this.maxEnergy = this.config.ultCost;
                this.state = STATE.IDLE; this.stateTimer = 0; this.hitstop = 0;
                this.currentAtk = this.config.atkDmg; this.currentSpeed = this.config.speed;
                this.matchTime = 0; this.stunTimer = 0; this.autoAttackTimer = 0; this.buffTickTimer = 0;
                this.hasHitThisAttack = false; this.attackData = null; this.isUltInterrupted = false; 

                // 预加载抠图
                if (!ImageCache[this.config.img_cut]) {
                    let img = new Image();
                    img.src = this.config.img_cut;
                    ImageCache[this.config.img_cut] = img;
                }
            }

            update() {
                if (this.state === STATE.DEAD) return;
                if (this.hitstop > 0) { this.hitstop--; return; }
                this.matchTime++; this.handlePassiveSkills();

                if (this.state === STATE.STUNNED) {
                    this.stunTimer--; this.vx = 0;
                    if (this.stunTimer <= 0) this.changeState(STATE.IDLE);
                    return;
                }
                if (this.autoAttackTimer > 0) {
                    this.autoAttackTimer--; if (this.autoAttackTimer <= 0) this.changeState(STATE.IDLE);
                    return;
                }

                this.vy += 2500 / 60; this.y += this.vy / 60;
                if (this.y >= 550) { this.y = 550; this.vy = 0; if (this.state === STATE.JUMP) this.changeState(STATE.IDLE); }

                if (this.state !== STATE.HIT && this.state !== STATE.ATTACK) this.handleInput();
                this.handleStateLogic();

                // 修复：vx现在直接代表像素/秒 的速度
                this.x += this.vx / 60;
                if (this.x < 80) this.x = 80; if (this.x > canvas.width - 80) this.x = canvas.width - 80;
            }

            handlePassiveSkills() {
                if (this.config.id === 2) this.currentAtk = this.config.atkDmg + Math.floor(this.matchTime / 180);
                if (this.config.id === 3) {
                    const decay = Math.floor(this.matchTime / 240);
                    this.currentSpeed = Math.max(150, this.config.speed - decay * 50);
                    this.currentAtk = this.config.atkDmg + decay * 3;
                }
                if (this.config.id === 4) {
                    this.buffTickTimer++;
                    if (this.buffTickTimer >= 600) { 
                        this.buffTickTimer = 0; this.currentAtk *= 0.66; this.currentSpeed *= 0.66; this.config.jump *= 0.8;
                    }
                }
            }

            handleInput() {
                const p1 = this.isP1;
                const left = p1 ? Input.isDown('KeyA') : Input.isDown('ArrowLeft');
                const right = p1 ? Input.isDown('KeyD') : Input.isDown('ArrowRight');
                const up = p1 ? Input.isDown('KeyW') : Input.isDown('ArrowUp');
                const down = p1 ? Input.isDown('KeyS') : Input.isDown('ArrowDown');
                const atk = p1 ? Input.isDown('KeyJ') : Input.isDown('Numpad1');
                const ult = p1 ? Input.isDown('KeyK') : Input.isDown('Numpad2');

                if (down && this.y >= 550) { this.changeState(STATE.BLOCK); this.vx = 0; return; }
                if (atk) { this.startAttack(false); return; }
                if (ult && this.energy >= this.maxEnergy && this.state !== STATE.ATTACK) { 
                    this.energy = 0; this.startAttack(true); return; 
                }

                if (this.state !== STATE.JUMP) {
                    if (up) { this.vy = this.config.jump; this.changeState(STATE.JUMP); }
                    // 修复移动：直接赋予速度值
                    else if (left) { this.vx = -this.currentSpeed; this.facing = -1; this.changeState(STATE.WALK); }
                    else if (right) { this.vx = this.currentSpeed; this.facing = 1; this.changeState(STATE.WALK); }
                    else { this.vx = 0; this.changeState(STATE.IDLE); }
                }
            }

            startAttack(isUltimate) {
                this.changeState(STATE.ATTACK);
                this.hasHitThisAttack = false; this.isUltInterrupted = false;
                this.attackData = { dmg: this.currentAtk, isUlt: isUltimate };

                if (isUltimate) {
                    switch(this.config.id) {
                        case 1: this.vx = this.facing * 600; this.stateTimer = 30; break; // 冲撞速度
                        case 2: Game.projectiles.push(new Projectile(this.x, this.y - 80, this.facing * 700, this, 'data')); this.stateTimer = 40; this.vx = 0; break;
                        case 3: Game.triggerGlobalStun(this); this.stateTimer = 40; this.vx = 0; break;
                        case 4: Game.projectiles.push(new Projectile(this.x, this.y - 80, this.facing * 900, this, 'halberd')); this.stateTimer = 40; this.vx = 0; break;
                        case 5: this.stateTimer = 35; this.vx = 0; break;
                    }
                } else { this.stateTimer = 15; this.vx = 0; }
            }

            handleStateLogic() {
                if (this.state === STATE.HIT) {
                    this.vx *= 0.8; if (--this.stateTimer <= 0) this.changeState(STATE.IDLE);
                }
                if (this.state === STATE.ATTACK) {
                    if (this.config.id === 5 && this.attackData?.isUlt && this.stateTimer === 10 && !this.isUltInterrupted) {
                        Game.triggerFearEffect(this);
                    }
                    if (--this.stateTimer <= 0) {
                        if (this.config.id === 1 && this.attackData.isUlt) this.vx = 0;
                        this.attackData = null; this.changeState(STATE.IDLE);
                    }
                }
            }

            changeState(s) {
                this.state = s;
                if (s === STATE.ATTACK) return;
                this.stateTimer = s === STATE.HIT ? 20 : 0;
            }

            getHurtbox() { return { x: this.x - this.width/2, y: this.y - this.height, w: this.width, h: this.height }; }
            getHitbox() {
                if (this.state !== STATE.ATTACK || !this.attackData || this.stateTimer < 5 || this.config.id === 5) return null;
                if (this.config.id === 1 && this.attackData.isUlt) return { x: this.facing === 1 ? this.x : this.x - 150, y: this.y - 150, w: 150, h: 150 };
                let range = this.attackData.isUlt ? 150 : 120;
                return { x: this.facing === 1 ? this.x : this.x - range, y: this.y - 140, w: range, h: 120 };
            }

            receiveHit(attacker, attackData, type = "normal") {
                if (this.state === STATE.DEAD) return;
                if (this.config.id === 5 && this.state === STATE.ATTACK && this.attackData?.isUlt && this.stateTimer > 10) {
                    this.isUltInterrupted = true; this.changeState(STATE.HIT); this.stateTimer = 30; this.vx = attacker.facing * 400;
                    this.hitstop = 10; attacker.hitstop = 10; return; 
                }
                if (type === "halberd") this.hp -= this.maxHp * 0.20; else this.hp -= attackData.dmg;
                this.energy = Math.min(this.maxEnergy, this.energy + 15);
                this.hitstop = 6; attacker.hitstop = 6;
                if (this.hp <= 0) { this.hp = 0; this.changeState(STATE.DEAD); return; }
                if (this.state !== STATE.BLOCK) { this.changeState(STATE.HIT); this.vx = attacker.facing * 300; }
            }

            applyStun(frames) { this.changeState(STATE.STUNNED); this.stunTimer = frames; }

            render() {
                const hurt = this.getHurtbox();
                
                // 尝试加载战斗抠图
                const img = ImageCache[this.config.img_cut];
                if (img && img.complete && img.naturalWidth > 0) {
                    // 画抠图
                    if (this.facing === -1) {
                        // 翻转绘制
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.scale(-1, 1);
                        // 调整绘制参数使人物居中
                        ctx.drawImage(img, -hurt.w/2, -hurt.h, hurt.w, hurt.h);
                        ctx.restore();
                    } else {
                        ctx.drawImage(img, hurt.x, hurt.y, hurt.w, hurt.h);
                    }
                } else {
                    // 没找到抠图就用色块
                    ctx.fillStyle = this.config.color;
                    ctx.fillRect(hurt.x, hurt.y, hurt.w, hurt.h);
                    // 画个眼睛方便看朝向
                    ctx.fillStyle = 'black';
                    ctx.fillRect(this.x - 15 + this.facing * 20, this.y - 140, 10, 10);
                    ctx.fillRect(this.x + 5 + this.facing * 20, this.y - 140, 10, 10);
                }

                // Debug 判定框
                if (this.state === STATE.ATTACK) {
                    const hit = this.getHitbox();
                    if (hit) { ctx.strokeStyle = 'red'; ctx.lineWidth = 3; ctx.strokeRect(hit.x, hit.y, hit.w, hit.h); }
                }
            }
        }

        const Game = {
            p1: null, p2: null, projectiles: [], isRunning: false, matchOver: false,
            
            init(c1, c2) {
                this.p1 = new Fighter(true, c1);
                this.p2 = new Fighter(false, c2);
                this.projectiles = [];
                this.isRunning = true; this.matchOver = false;
                
                document.getElementById('battle-ui').style.display = 'block';
                document.getElementById('p1-hud-name').innerText = this.p1.config.name;
                document.getElementById('p2-hud-name').innerText = this.p2.config.name;
                
                document.getElementById('p1-hud-avatar').innerHTML = `<img src="${this.p1.config.img}" onerror="this.style.display='none'; this.parentElement.style.background='${this.p1.config.color}'">`;
                document.getElementById('p2-hud-avatar').innerHTML = `<img src="${this.p2.config.img}" onerror="this.style.display='none'; this.parentElement.style.background='${this.p2.config.color}'">`;
            },

            updateUI() {
                if(!this.p1 || !this.p2) return;
                document.getElementById('p1-hud-hp').style.width = Math.max(0, (this.p1.hp / this.p1.maxHp) * 100) + '%';
                document.getElementById('p2-hud-hp').style.width = Math.max(0, (this.p2.hp / this.p2.maxHp) * 100) + '%';
                document.getElementById('p1-hud-energy').style.width = (this.p1.energy / this.p1.maxEnergy) * 100 + '%';
                document.getElementById('p2-hud-energy').style.width = (this.p2.energy / this.p2.maxEnergy) * 100 + '%';
            },

            triggerFearEffect(caster) {
                const target = caster.isP1 ? this.p2 : this.p1; if (target.state === STATE.DEAD) return;
                target.applyStun(60); let drain = 15;
                target.hp = Math.max(0, target.hp - drain); caster.hp = Math.min(caster.maxHp, caster.hp + drain);
                target.currentAtk = Math.max(1, target.currentAtk - 2); target.currentSpeed = Math.max(50, target.currentSpeed - 15);
                caster.currentAtk += 2; caster.currentSpeed += 15;
                target.hitstop = 10; caster.hitstop = 10;
                if (target.hp <= 0) { target.hp = 0; target.changeState(STATE.DEAD); }
            },
            triggerGlobalStun(attacker) {
                const target = attacker.isP1 ? this.p2 : this.p1;
                if (Math.abs(attacker.x - target.x) < 250) { target.applyStun(60); target.autoAttackTimer = 60; target.hp -= 15; }
            },

            tick() {
                if (!this.isRunning || this.matchOver) return;
                this.p1.update(); this.p2.update();
                this.projectiles.forEach(p => p.update());
                this.projectiles = this.projectiles.filter(p => p.active);
                this.checkCombat(this.p1, this.p2); this.checkCombat(this.p2, this.p1);
                this.projectiles.forEach(p => {
                    const target = p.owner === this.p1 ? this.p2 : this.p1;
                    if (this.checkAABB(p.getHurtbox(), target.getHurtbox())) {
                        p.active = false;
                        if (p.type === 'data') { target.applyStun(120); target.hp -= 5; }
                        else if (p.type === 'halberd') target.receiveHit(p.owner, { dmg: 0 }, "halberd");
                    }
                });

                this.updateUI();

                if (this.p1.hp <= 0 || this.p2.hp <= 0) {
                    this.matchOver = true;
                    setTimeout(() => {
                        alert(`${this.p1.hp <= 0 ? '2P' : '1P'} 胜利!\n点击确定返回选人`);
                        UI.showSelect();
                    }, 100);
                }
            },

            checkCombat(attacker, target) {
                const hit = attacker.getHitbox(); const hurt = target.getHurtbox();
                if (hit && !attacker.hasHitThisAttack && this.checkAABB(hit, hurt)) {
                    attacker.hasHitThisAttack = true; target.receiveHit(attacker, attacker.attackData);
                }
            },

            checkAABB(r1, r2) { return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y; },

            render() {
                ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#222'; ctx.fillRect(0, 550, canvas.width, 125);
                ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
                for(let i=0; i<canvas.width; i+=100) {
                    ctx.beginPath(); ctx.moveTo(i, 550); ctx.lineTo(i-100, 675); ctx.stroke();
                }
                
                if (this.isRunning) {
                    this.p1.render(); this.p2.render();
                    this.projectiles.forEach(p => {
                        ctx.fillStyle = p.type === 'data' ? '#00ffff' : '#ffaa00';
                        const h = p.getHurtbox(); ctx.fillRect(h.x, h.y, h.w, h.h);
                    });
                }
            }
        };

        const UI = {
            p1Selection: 1,
            p2Selection: 5,
            currentTurn: 1, // 1 代表 P1 在选，2 代表 P2 在选
            
            init() {
                const list = document.getElementById('char-list');
                list.innerHTML = '';
                
                CHARACTERS.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'char-card';
                    card.id = `char-card-${c.id}`;
                    
                    card.innerHTML = `
                        <div class="char-avatar">
                            <img src="${c.img}" onerror="this.style.display='none'; this.parentElement.style.background='${c.color}'">
                        </div>
                        <div class="char-info">
                            <div class="char-title">
                                <span>${c.name}</span>
                                <span class="char-type">${c.type}</span>
                            </div>
                            <div class="char-desc">
                                必杀「${c.ultName}」<br>${c.desc}
                            </div>
                        </div>
                    `;
                    card.addEventListener('pointerdown', () => this.selectChar(c.id));
                    list.appendChild(card);
                });

                document.getElementById('btn-start-game').addEventListener('pointerdown', () => this.startGame());
                
                window.addEventListener('keydown', (e) => {
                    if(document.getElementById('select-screen').style.display !== 'none') {
                        if(e.code === 'Digit1') this.setP1(1);
                        if(e.code === 'Digit2') this.setP1(2);
                        if(e.code === 'Digit3') this.setP1(3);
                        if(e.code === 'Digit4') this.setP1(4);
                        if(e.code === 'Digit5') this.setP1(5);

                        if(e.code === 'Numpad7') this.setP2(1);
                        if(e.code === 'Numpad8') this.setP2(2);
                        if(e.code === 'Numpad9') this.setP2(3);
                        if(e.code === 'Numpad4') this.setP2(4);
                        if(e.code === 'Numpad5') this.setP2(5);

                        if(e.code === 'Space') this.startGame();
                    }
                });

                this.updateShowcases();
            },

            // 点击卡片，按回合分配
            selectChar(id) {
                if (this.currentTurn === 1) {
                    this.p1Selection = id;
                    this.currentTurn = 2; // 切换给 P2
                } else {
                    this.p2Selection = id;
                    this.currentTurn = 1; // 切换回 P1
                }
                this.updateShowcases();
            },

            setP1(id) { this.p1Selection = id; this.currentTurn = 2; this.updateShowcases(); },
            setP2(id) { this.p2Selection = id; this.currentTurn = 1; this.updateShowcases(); },

            updateShowcases() {
                // 更新提示文字
                const turnText = document.getElementById('select-turn-text');
                turnText.innerText = this.currentTurn === 1 ? "👈 P1 请选择角色 (点击列表)" : "👉 P2 请选择角色 (点击列表)";
                turnText.style.color = this.currentTurn === 1 ? "#00ccff" : "#ff3333";

                // 更新高亮边框
                document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected-p1', 'selected-p2'));
                document.getElementById(`char-card-${this.p1Selection}`).classList.add('selected-p1');
                document.getElementById(`char-card-${this.p2Selection}`).classList.add('selected-p2');

                // 更新左侧 P1 展示 (全图)
                const c1 = CHARACTERS.find(c => c.id === this.p1Selection);
                document.getElementById('p1-name-badge').innerText = c1.name;
                document.getElementById('p1-name-badge').style.background = c1.color;
                document.getElementById('p1-img-box').innerHTML = `<img src="${c1.img}" onerror="this.style.display='none'; this.parentElement.style.background='${c1.color}'">`;
                document.getElementById('p1-ult-text').innerText = `必杀「${c1.ultName}」`;
                document.getElementById('p1-stats').innerHTML = this.getStatsHTML(c1);
                
                // 更新右侧 P2 展示 (全图)
                const c2 = CHARACTERS.find(c => c.id === this.p2Selection);
                document.getElementById('p2-name-badge').innerText = c2.name;
                document.getElementById('p2-name-badge').style.background = c2.color;
                document.getElementById('p2-img-box').innerHTML = `<img src="${c2.img}" onerror="this.style.display='none'; this.parentElement.style.background='${c2.color}'">`;
                document.getElementById('p2-ult-text').innerText = `必杀「${c2.ultName}」`;
                document.getElementById('p2-stats').innerHTML = this.getStatsHTML(c2);

                document.getElementById('btn-start-game').classList.remove('disabled');
            },

            getStatsHTML(c) {
                let html = '';
                html += `<div class="stat-row"><div class="stat-label">速度</div><div class="stat-bar">`;
                for(let i=1; i<=5; i++) html += `<div class="stat-seg ${i <= c.stats.speed ? 'active' : ''}"></div>`;
                html += `</div></div>`;
                html += `<div class="stat-row"><div class="stat-label">力量</div><div class="stat-bar">`;
                for(let i=1; i<=5; i++) html += `<div class="stat-seg ${i <= c.stats.power ? 'active power' : ''}"></div>`;
                html += `</div></div>`;
                html += `<div class="stat-row"><div class="stat-label">体力</div><div class="stat-bar">`;
                for(let i=1; i<=5; i++) html += `<div class="stat-seg ${i <= c.stats.hp ? 'active hp' : ''}"></div>`;
                html += `</div></div>`;
                return html;
            },

            showSelect() {
                document.getElementById('battle-ui').style.display = 'none';
                document.getElementById('select-screen').style.display = 'flex';
                document.getElementById('select-screen').style.opacity = 1;
                this.currentTurn = 1; // 重置回合
                this.updateShowcases();
            },

            startGame() {
                if (this.p1Selection === null || this.p2Selection === null) return;
                document.getElementById('select-screen').style.opacity = 0;
                setTimeout(() => {
                    document.getElementById('select-screen').style.display = 'none';
                    Game.init(this.p1Selection, this.p2Selection);
                }, 300);
            }
        };

        let acc = 0, lastTime = performance.now();

        function loop(time) {
            const dt = (time - lastTime) / 1000; lastTime = time;
            
            if (Game.isRunning && !Game.matchOver) {
                acc += dt;
                while (acc >= 1/60) { Game.tick(); acc -= 1/60; }
            }
            
            Game.render();
            Input.update();
            requestAnimationFrame(loop);
        }

        UI.init();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
