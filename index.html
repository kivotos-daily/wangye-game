<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 【版本迭代点 1】网页标签标题 -->
    <title>十五格斗-测试版v1.0</title>
    <style>
        body { margin: 0; padding: 0; background: #1a1a2e; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; }
        #ui-layer { position: absolute; top: 10px; text-align: center; }
        .version-tag { color: #ffcc00; font-weight: bold; font-size: 14px; }
        canvas { box-shadow: 0 0 20px rgba(0,0,0,0.8); border: 2px solid #333; }
    </style>
</head>
<body>
    <!-- 【版本迭代点 2】页面 UI 标题 -->
    <div id="ui-layer">
        <h2>十五格斗 <span class="version-tag">测试版v1.0</span></h2>
        <h3>P1 选择：按 1-5 选择角色 | P2 选择：按 小键盘 7-0 选择角色</h3>
        <h3 style="color: #00ff00">按 空格键 开始/重新开始</h3>
    </div>
    <canvas id="gameCanvas" width="1000" height="600"></canvas>

    <script>
        // 【版本迭代点 3】游戏核心版本号常量
        const GAME_VERSION = "测试版v1.0";

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const CHARACTERS = [
            { id: 1, name: "辣子鸡", type: "力量型", maxHp: 120, speed: 200, jump: -800, atkDmg: 15, color: "#ff4d4d", ultCost: 100 },
            { id: 2, name: "迪客", type: "智慧型", maxHp: 100, speed: 300, jump: -900, atkDmg: 5, color: "#4da6ff", ultCost: 100 },
            { id: 3, name: "黑色神秘生物", type: "敏捷型", maxHp: 90, speed: 450, jump: -1000, atkDmg: 5, color: "#333333", ultCost: 100 },
            { id: 4, name: "吕布", type: "力量型", maxHp: 150, speed: 350, jump: -850, atkDmg: 20, color: "#cc0000", ultCost: 100 },
            { id: 5, name: "双马尾", type: "精神型", maxHp: 60, speed: 180, jump: -700, atkDmg: 3, color: "#ff99cc", ultCost: 40 }
        ];

        const Input = {
            keys: {}, prevKeys: {},
            init() { window.addEventListener('keydown', e => this.keys[e.code] = true); window.addEventListener('keyup', e => this.keys[e.code] = false); },
            isDown(code) { return !!this.keys[code]; },
            isJustPressed(code) { return this.keys[code] && !this.prevKeys[code]; },
            update() { this.prevKeys = { ...this.keys }; }
        };
        Input.init();

        const STATE = { IDLE: 0, WALK: 1, JUMP: 2, BLOCK: 3, HIT: 4, ATTACK: 5, DEAD: 6, STUNNED: 7 };

        class Projectile {
            constructor(x, y, vx, owner, type) {
                this.x = x; this.y = y; this.vx = vx; this.owner = owner; this.type = type;
                this.width = type === 'halberd' ? 60 : 40;
                this.height = type === 'halberd' ? 20 : 40;
                this.active = true; this.life = 120;
            }
            update() {
                this.x += this.vx / 60; this.life--;
                if (this.life <= 0 || this.x < 0 || this.x > canvas.width) this.active = false;
            }
            getHurtbox() { return { x: this.x - this.width/2, y: this.y - this.height/2, w: this.width, h: this.height }; }
        }

        class Fighter {
            constructor(isP1, charId) {
                this.isP1 = isP1;
                this.config = CHARACTERS.find(c => c.id === charId);
                this.x = isP1 ? 250 : 750;
                this.y = 500; this.vx = 0; this.vy = 0;
                this.width = 60; this.height = 100; this.facing = isP1 ? 1 : -1;
                
                this.maxHp = this.config.maxHp; this.hp = this.maxHp;
                this.energy = 0; this.maxEnergy = this.config.ultCost;
                
                this.state = STATE.IDLE; this.stateTimer = 0; this.hitstop = 0;
                this.currentAtk = this.config.atkDmg; this.currentSpeed = this.config.speed;
                
                this.matchTime = 0; this.stunTimer = 0; this.autoAttackTimer = 0; this.buffTickTimer = 0;
                this.hasHitThisAttack = false; this.attackData = null;
                this.isUltInterrupted = false; 
            }

            update() {
                if (this.state === STATE.DEAD) return;
                if (this.hitstop > 0) { this.hitstop--; return; }

                this.matchTime++;
                this.handlePassiveSkills();

                if (this.state === STATE.STUNNED) {
                    this.stunTimer--; this.vx = 0;
                    if (this.stunTimer <= 0) this.changeState(STATE.IDLE);
                    return;
                }
                if (this.autoAttackTimer > 0) {
                    this.autoAttackTimer--; if (this.autoAttackTimer <= 0) this.changeState(STATE.IDLE);
                    return;
                }

                this.vy += 2500 / 60; this.y += this.vy / 60;
                if (this.y >= 500) { this.y = 500; this.vy = 0; if (this.state === STATE.JUMP) this.changeState(STATE.IDLE); }

                if (this.state !== STATE.HIT && this.state !== STATE.ATTACK) this.handleInput();
                this.handleStateLogic();

                this.x += (this.vx * this.currentSpeed / this.config.speed) / 60;
                if (this.x < 50) this.x = 50; if (this.x > canvas.width - 50) this.x = canvas.width - 50;
            }

            handlePassiveSkills() {
                if (this.config.id === 2) this.currentAtk = this.config.atkDmg + Math.floor(this.matchTime / 180);
                if (this.config.id === 3) {
                    const decay = Math.floor(this.matchTime / 240);
                    this.currentSpeed = Math.max(150, this.config.speed - decay * 50);
                    this.currentAtk = this.config.atkDmg + decay * 3;
                }
                if (this.config.id === 4) {
                    this.buffTickTimer++;
                    if (this.buffTickTimer >= 600) { 
                        this.buffTickTimer = 0; this.currentAtk *= 0.66; this.currentSpeed *= 0.66; this.config.jump *= 0.8;
                    }
                }
            }

            handleInput() {
                const p1 = this.isP1;
                const left = p1 ? Input.isDown('KeyA') : Input.isDown('ArrowLeft');
                const right = p1 ? Input.isDown('KeyD') : Input.isDown('ArrowRight');
                const up = p1 ? Input.isDown('KeyW') : Input.isDown('ArrowUp');
                const down = p1 ? Input.isDown('KeyS') : Input.isDown('ArrowDown');
                const atk = p1 ? Input.isDown('KeyJ') : Input.isDown('Numpad1');
                const ult = p1 ? Input.isDown('KeyK') : Input.isDown('Numpad2');

                if (down && this.y >= 500) { this.changeState(STATE.BLOCK); this.vx = 0; return; }
                if (atk) { this.startAttack(false); return; }
                
                if (ult && this.energy >= this.maxEnergy && this.state !== STATE.ATTACK) { 
                    this.energy = 0; this.startAttack(true); return; 
                }

                if (this.state !== STATE.JUMP) {
                    if (up) { this.vy = this.config.jump; this.changeState(STATE.JUMP); }
                    else if (left) { this.vx = -1; this.facing = -1; this.changeState(STATE.WALK); }
                    else if (right) { this.vx = 1; this.facing = 1; this.changeState(STATE.WALK); }
                    else { this.vx = 0; this.changeState(STATE.IDLE); }
                }
            }

            startAttack(isUltimate) {
                this.changeState(STATE.ATTACK);
                this.hasHitThisAttack = false;
                this.isUltInterrupted = false;
                this.attackData = { dmg: this.currentAtk, isUlt: isUltimate };

                if (isUltimate) {
                    switch(this.config.id) {
                        case 1: this.vx = this.facing * 3; this.stateTimer = 30; break;
                        case 2: Game.projectiles.push(new Projectile(this.x, this.y - 50, this.facing * 600, this, 'data')); this.stateTimer = 40; break;
                        case 3: Game.triggerGlobalStun(this); this.stateTimer = 40; break;
                        case 4: Game.projectiles.push(new Projectile(this.x, this.y - 50, this.facing * 800, this, 'halberd')); this.stateTimer = 40; break;
                        case 5: this.stateTimer = 35; break;
                    }
                } else {
                    this.stateTimer = 15;
                }
            }

            handleStateLogic() {
                if (this.state === STATE.HIT) {
                    this.vx *= 0.9;
                    if (--this.stateTimer <= 0) this.changeState(STATE.IDLE);
                }
                if (this.state === STATE.ATTACK) {
                    if (this.config.id === 5 && this.attackData?.isUlt && this.stateTimer === 10 && !this.isUltInterrupted) {
                        Game.triggerFearEffect(this);
                    }
                    if (--this.stateTimer <= 0) {
                        if (this.config.id === 1 && this.attackData.isUlt) this.vx = 0;
                        this.attackData = null; this.changeState(STATE.IDLE);
                    }
                }
            }

            changeState(s) {
                this.state = s;
                if (s === STATE.ATTACK) return;
                this.stateTimer = s === STATE.HIT ? 20 : 0;
            }

            getHurtbox() { return { x: this.x - this.width/2, y: this.y - this.height, w: this.width, h: this.height }; }
            getHitbox() {
                if (this.state !== STATE.ATTACK || !this.attackData || this.stateTimer < 5 || this.config.id === 5) return null;
                
                if (this.config.id === 1 && this.attackData.isUlt) {
                    return { x: this.facing === 1 ? this.x : this.x - 100, y: this.y - 80, w: 100, h: 80 };
                }

                let range = this.attackData.isUlt ? 120 : 70;
                return { x: this.facing === 1 ? this.x : this.x - range, y: this.y - 80, w: range, h: 60 };
            }

            receiveHit(attacker, attackData, type = "normal") {
                if (this.state === STATE.DEAD) return;

                if (this.config.id === 5 && this.state === STATE.ATTACK && this.attackData?.isUlt && this.stateTimer > 10) {
                    this.isUltInterrupted = true;
                    this.changeState(STATE.HIT);
                    this.stateTimer = 30; 
                    this.vx = attacker.facing * 4;
                    this.hitstop = 10; attacker.hitstop = 10;
                    return; 
                }

                if (type === "halberd") this.hp -= this.maxHp * 0.20;
                else this.hp -= attackData.dmg;

                this.energy = Math.min(this.maxEnergy, this.energy + 15);
                this.hitstop = 6; attacker.hitstop = 6;
                
                if (this.hp <= 0) { this.hp = 0; this.changeState(STATE.DEAD); return; }
                if (this.state !== STATE.BLOCK) {
                    this.changeState(STATE.HIT);
                    this.vx = attacker.facing * 2;
                }
            }

            applyStun(frames) { this.changeState(STATE.STUNNED); this.stunTimer = frames; }

            render() {
                const hurt = this.getHurtbox();
                ctx.fillStyle = this.config.color;
                ctx.fillRect(hurt.x, hurt.y, hurt.w, hurt.h);
                
                ctx.fillStyle = 'white'; ctx.font = '14px Arial'; ctx.textAlign = 'center';
                ctx.fillText(this.config.name, this.x, this.y - 110);
                if (this.config.id === 4 && this.buffTickTimer > 500) { ctx.fillStyle = 'yellow'; ctx.fillText("警告:即将杀死义父", this.x, this.y - 130); }
                if (this.config.id === 5 && this.state === STATE.ATTACK && this.attackData?.isUlt && !this.isUltInterrupted) {
                    ctx.fillStyle = '#ff00ff'; ctx.fillText("施法中...", this.x, this.y - 130);
                    ctx.fillStyle = '#555'; ctx.fillRect(this.x - 30, this.y - 125, 60, 5);
                    ctx.fillStyle = '#ff00ff'; ctx.fillRect(this.x - 30, this.y - 125, 60 * ((35 - this.stateTimer) / 25), 5);
                }

                if (this.state === STATE.ATTACK) {
                    const hit = this.getHitbox();
                    if (hit) { ctx.strokeStyle = 'red'; ctx.strokeRect(hit.x, hit.y, hit.w, hit.h); }
                }
            }
        }

        const Game = {
            p1: null, p2: null, projectiles: [], isRunning: false, matchOver: false,
            
            init(c1, c2) {
                this.p1 = new Fighter(true, c1);
                this.p2 = new Fighter(false, c2);
                this.projectiles = [];
                this.isRunning = true; this.matchOver = false;
            },

            triggerFearEffect(caster) {
                const target = caster.isP1 ? this.p2 : this.p1;
                if (target.state === STATE.DEAD) return;
                
                target.applyStun(60);
                
                let drain = 15;
                target.hp = Math.max(0, target.hp - drain);
                caster.hp = Math.min(caster.maxHp, caster.hp + drain);
                
                target.currentAtk = Math.max(1, target.currentAtk - 2);
                target.currentSpeed = Math.max(50, target.currentSpeed - 15);
                
                caster.currentAtk += 2;
                caster.currentSpeed += 15;
                
                target.hitstop = 10; caster.hitstop = 10;

                if (target.hp <= 0) { target.hp = 0; target.changeState(STATE.DEAD); }
            },

            triggerGlobalStun(attacker) {
                const target = attacker.isP1 ? this.p2 : this.p1;
                if (Math.abs(attacker.x - target.x) < 200) {
                    target.applyStun(60); target.autoAttackTimer = 60; target.hp -= 15; 
                }
            },

            tick() {
                if (!this.isRunning || this.matchOver) return;

                this.p1.update(); this.p2.update();
                this.projectiles.forEach(p => p.update());
                this.projectiles = this.projectiles.filter(p => p.active);

                this.checkCombat(this.p1, this.p2); this.checkCombat(this.p2, this.p1);

                this.projectiles.forEach(p => {
                    const target = p.owner === this.p1 ? this.p2 : this.p1;
                    if (this.checkAABB(p.getHurtbox(), target.getHurtbox())) {
                        p.active = false;
                        if (p.type === 'data') { 
                            target.applyStun(120);
                            target.hp -= 5;       
                        }
                        else if (p.type === 'halberd') target.receiveHit(p.owner, { dmg: 0 }, "halberd");
                    }
                });

                if (this.p1.hp <= 0 || this.p2.hp <= 0) {
                    this.matchOver = true;
                    // 【版本迭代点 4】游戏结束文案加入版本号
                    document.getElementById('ui-layer').innerHTML = `<h1>Game Over! ${this.p1.hp <= 0 ? '2P' : '1P'} 胜利!</h1><h3 style="color: #ffcc00">当前版本: ${GAME_VERSION}</h3><h3>按 空格键 重新开始</h3>`;
                }
            },

            checkCombat(attacker, target) {
                const hit = attacker.getHitbox(); const hurt = target.getHurtbox();
                if (hit && !attacker.hasHitThisAttack && this.checkAABB(hit, hurt)) {
                    attacker.hasHitThisAttack = true;
                    target.receiveHit(attacker, attacker.attackData);
                }
            },

            checkAABB(r1, r2) { return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y; },

            render() {
                ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#222'; ctx.fillRect(0, 500, canvas.width, 100);
                
                if (this.isRunning) {
                    this.p1.render(); this.p2.render();
                    
                    this.projectiles.forEach(p => {
                        ctx.fillStyle = p.type === 'data' ? '#00ffff' : '#ffaa00';
                        const h = p.getHurtbox(); ctx.fillRect(h.x, h.y, h.w, h.h);
                    });

                    this.drawHealthBar(50, 50, this.p1, false);
                    this.drawHealthBar(canvas.width - 350, 50, this.p2, true);
                    
                    // 【版本迭代点 5】画面右下角常驻显示版本号
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)'; 
                    ctx.font = '12px Arial'; 
                    ctx.textAlign = 'right';
                    ctx.fillText(`十五格斗 ${GAME_VERSION}`, canvas.width - 20, canvas.height - 20);
                }
            },

            drawHealthBar(x, y, fighter, isRight) {
                ctx.fillStyle = '#333'; ctx.fillRect(x, y, 300, 20);
                ctx.fillStyle = '#ff3333'; ctx.fillRect(x, y, 300 * (fighter.hp / fighter.maxHp), 20);
                ctx.fillStyle = '#fff'; ctx.font = '16px Arial'; ctx.textAlign = isRight ? 'right' : 'left';
                ctx.fillText(`${fighter.config.name} (${fighter.config.type})`, isRight ? x + 300 : x, y - 10);
                
                ctx.fillStyle = '#333'; ctx.fillRect(x, y + 25, 200, 10);
                ctx.fillStyle = '#00ccff'; ctx.fillRect(x, y + 25, 200 * (fighter.energy / fighter.maxEnergy), 10);
            }
        };

        let acc = 0, lastTime = performance.now();
        let selecting = true;
        let p1Selection = 1, p2Selection = 5;

        function loop(time) {
            const dt = (time - lastTime) / 1000; lastTime = time;
            
            if (selecting) {
                if (Input.isJustPressed('Digit1')) p1Selection = 1;
                if (Input.isJustPressed('Digit2')) p1Selection = 2;
                if (Input.isJustPressed('Digit3')) p1Selection = 3;
                if (Input.isJustPressed('Digit4')) p1Selection = 4;
                if (Input.isJustPressed('Digit5')) p1Selection = 5;

                if (Input.isJustPressed('Numpad7')) p2Selection = 1;
                if (Input.isJustPressed('Numpad8')) p2Selection = 2;
                if (Input.isJustPressed('Numpad9')) p2Selection = 3;
                if (Input.isJustPressed('Numpad4')) p2Selection = 4;
                if (Input.isJustPressed('Numpad5')) p2Selection = 5;

                if (Input.isJustPressed('Space')) {
                    selecting = false; Game.init(p1Selection, p2Selection);
                    document.getElementById('ui-layer').innerHTML = `<h2>十五格斗 <span class="version-tag">${GAME_VERSION}</span></h2><h3>P1: ${CHARACTERS[p1Selection-1].name} VS P2: ${CHARACTERS[p2Selection-1].name}</h3>`;
                }
                renderSelectScreen();
            } else {
                if (Input.isJustPressed('Space') && Game.matchOver) {
                    selecting = true;
                    document.getElementById('ui-layer').innerHTML = `<h2>十五格斗 <span class="version-tag">${GAME_VERSION}</span></h2><h3>P1 选择：按 1-5 选择角色 | P2 选择：按 小键盘 7-0 选择角色</h3><h3 style="color: #00ff00">按 空格键 开始/重新开始</h3>`;
                }
                
                acc += dt;
                while (acc >= 1/60) { Game.tick(); acc -= 1/60; }
                Game.render();
            }
            Input.update(); requestAnimationFrame(loop);
        }

        function renderSelectScreen() {
            ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff'; ctx.font = '30px Arial'; ctx.textAlign = 'center';
            ctx.fillText("十五格斗 - 选择角色", canvas.width/2, 80);

            CHARACTERS.forEach((c, i) => {
                let x = 100 + i * 160; let y = 200; 
                ctx.fillStyle = c.color; ctx.fillRect(x, y, 100, 100);
                if (p1Selection === c.id) { ctx.strokeStyle = 'blue'; ctx.lineWidth = 6; ctx.strokeRect(x, y, 100, 100); }
                if (p2Selection === c.id) { ctx.strokeStyle = 'red'; ctx.lineWidth = 3; ctx.strokeRect(x-3, y-3, 106, 106); }
                
                ctx.fillStyle = 'white'; ctx.font = '16px Arial';
                ctx.fillText(c.name, x + 50, y + 130);
                ctx.fillText(c.type, x + 50, y + 150);
            });
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
