<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>十五网页游戏大厅 - v2.2</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
        body { background: #111; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: "Microsoft YaHei", sans-serif; overflow: hidden; color: white; }
        
        #game-container { position: relative; width: 100%; max-width: 1200px; height: 100vh; max-height: 800px; aspect-ratio: 16/9; overflow: hidden; background: #000; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        canvas { width: 100%; height: 100%; display: block; }

        /* ==================== 1. 开场动画 CSS ==================== */
        #intro-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; overflow: hidden; transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out; }
        #intro-screen.hide { opacity: 0; transform: scale(1.1); pointer-events: none; }

        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 2px), radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 1px); background-size: 100px 100px, 50px 50px; background-position: 0 0, 25px 25px; opacity: 0.3; animation: starMove 20s linear infinite; z-index: -1; }
        @keyframes starMove { from { background-position: 0 0, 25px 25px; } to { background-position: 0 1000px, 25px 1025px; } }

        .fade-text { font-size: 5vw; font-weight: bold; letter-spacing: 8px; color: #fff; opacity: 0; transition: opacity 1.5s ease-in-out, transform 1.5s; text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px #00ccff; transform: scale(0.9); position: absolute; }
        .fade-text.show { opacity: 1; transform: scale(1); }
        
        .intro-img-group { display: none; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 1.5s ease-in-out, transform 1.5s; width: 100%; height: 100%; padding: 20px; transform: translateY(20px); }
        .intro-img-group.show { opacity: 1; transform: translateY(0); }
        
        .intro-img-group img { max-width: 80%; max-height: 35vh; margin-bottom: 10px; border-radius: 15px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }

        .intro-credit { font-size: 4vw; color: #00ffcc; font-weight: bold; margin-top: 15px; text-shadow: 0 0 10px rgba(0,255,204,0.6); letter-spacing: 2px; text-align: center; }

        .skip-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 8px 20px; border-radius: 20px; font-size: 16px; cursor: pointer; z-index: 210; transition: 0.3s; backdrop-filter: blur(5px); }
        .skip-btn:hover { background: rgba(255,255,255,0.3); }

        /* ==================== 2. 游戏大厅主菜单 CSS ==================== */
        #menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1f1c2c, #4b1b73); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 150; opacity: 0; transform: scale(0.95); transition: opacity 1s ease-out, transform 1s ease-out; }
        #menu-screen.show { opacity: 1; transform: scale(1); }

        .menu-title { font-size: 5vw; font-weight: bold; color: #ffd700; margin-bottom: 40px; text-shadow: 2px 2px 0 #000; letter-spacing: 4px; }
        .menu-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
        
        .menu-card { width: 250px; height: 320px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); backdrop-filter: blur(10px); position: relative; }
        .menu-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .menu-card.active { border-color: #00ffcc; background: rgba(0, 255, 204, 0.1); box-shadow: 0 0 20px rgba(0,255,204,0.4); }
        
        .menu-card.locked { cursor: not-allowed; opacity: 0.6; filter: grayscale(1); }
        .menu-card.locked:hover { transform: none; box-shadow: none; }
        
        .card-icon { font-size: 70px; margin-bottom: 20px; }
        .card-title { font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .card-desc { font-size: 14px; color: #aaa; text-align: center; padding: 0 20px; line-height: 1.5; }
        .lock-icon { position: absolute; top: 15px; right: 15px; font-size: 24px; color: #ff4d4d; }

        /* ==================== 3. 选人界面 CSS ==================== */
        #select-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #2b1b54, #4b1b73); display: none; flex-direction: column; color: white; z-index: 100; transition: opacity 0.5s ease-out, transform 0.5s ease-out; opacity: 0; transform: translateY(20px); }
        #select-screen.show { opacity: 1; transform: translateY(0); }

        .select-header { text-align: center; padding: 10px 0; }
        .select-header h1 { font-size: 28px; color: #ffd700; text-shadow: 2px 2px 0 #000; margin-bottom: 5px; }
        .select-main { flex: 1; display: flex; justify-content: space-between; padding: 0 20px; overflow: hidden; }
        .player-panel { width: 46%; display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.3); border-radius: 15px; padding: 15px; position: relative; border: 2px solid transparent; }
        .player-panel.p1-active { border-color: #00ccff; box-shadow: 0 0 15px rgba(0,204,255,0.3); }
        .player-panel.p2-active { border-color: #ff3333; box-shadow: 0 0 15px rgba(255,51,51,0.3); }
        .player-title { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .p1-title { color: #00ccff; } .p2-title { color: #ff3333; }
        .char-selector { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 10px; }
        .nav-btn { background: rgba(255,255,255,0.2); border: none; color: white; font-size: 24px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .nav-btn:active { background: rgba(255,255,255,0.5); transform: scale(0.9); }
        .char-name-badge { background: #333; padding: 5px 15px; border-radius: 20px; font-weight: bold; border: 2px solid white; font-size: 16px; text-align: center; flex: 1; margin: 0 10px; }
        .char-img-box { width: 100%; height: 200px; border-radius: 15px; display: flex; justify-content: center; align-items: flex-end; box-shadow: 0 10px 20px rgba(0,0,0,0.5); overflow: hidden; position: relative; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.5) 100%); border: 2px solid rgba(255,255,255,0.2); }
        .char-img-box img { width: 90%; height: 95%; object-fit: contain; filter: drop-shadow(0 0 10px rgba(0,200,255,0.5)); }
        .stats-box { width: 100%; margin-top: 10px; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 10px; }
        .stat-row { display: flex; align-items: center; margin-bottom: 4px; }
        .stat-label { width: 35px; font-size: 12px; color: #aaa; }
        .stat-bar { flex: 1; height: 8px; background: #333; border-radius: 4px; overflow: hidden; display: flex; gap: 2px; }
        .stat-seg { flex: 1; background: #555; }
        .stat-seg.active { background: #00ccff; }
        .stat-seg.active.power { background: #ff3333; }
        .stat-seg.active.hp { background: #00ff00; }
        .char-ult { color: #ffd700; font-weight: bold; margin-top: 10px; font-size: 15px; text-shadow: 1px 1px 0 #000; }
        .char-desc { font-size: 12px; color: #ddd; text-align: center; margin-top: 5px; line-height: 1.4; }
        .select-footer { padding: 10px; text-align: center; display: flex; justify-content: center; gap: 20px; }
        .btn-action { background: #ffd700; color: #000; font-size: 20px; font-weight: bold; padding: 8px 40px; border-radius: 25px; border: none; cursor: pointer; box-shadow: 0 4px 0 #b38f00; transition: 0.1s; }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }
        .btn-back { background: #666; color: #fff; box-shadow: 0 4px 0 #333; }

        /* ==================== 4. 战斗界面 ==================== */
        #battle-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: none; }
        .top-hud { display: flex; justify-content: space-between; align-items: flex-start; padding: 15px 20px 0; width: 100%; }
        .hud-player { width: 42%; display: flex; align-items: center; gap: 10px; }
        .hud-player.right { flex-direction: row-reverse; }
        .hud-avatar { width: 70px; height: 70px; border-radius: 50%; border: 3px solid white; background: #333; flex-shrink: 0; overflow: hidden; }
        .hud-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
        .hud-bars { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .hud-name { font-size: 16px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #000; }
        .hud-player.right .hud-name { text-align: right; }
        .bar-container { height: 22px; background: #333; border: 2px solid #fff; border-radius: 11px; position: relative; overflow: hidden; }
        .bar-hp { height: 100%; background: linear-gradient(to right, #00ff00, #8bff00); width: 100%; transition: width 0.2s; }
        .hud-player.right .bar-hp { background: linear-gradient(to left, #00ff00, #8bff00); margin-left: auto; }
        .bar-container.energy { height: 12px; border-radius: 6px; width: 80%; margin-top: 4px; }
        .hud-player.right .bar-container.energy { margin-left: auto; }
        .bar-energy { height: 100%; background: linear-gradient(to right, #00ccff, #00ffff); width: 0%; transition: width 0.1s; }
        .hud-player.right .bar-energy { background: linear-gradient(to left, #00ccff, #00ffff); margin-left: auto; }
        .timer-box { background: #ffd700; color: #000; font-size: 30px; font-weight: bold; width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 3px solid #fff; margin-top: 5px; }

        #touch-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; justify-content: space-between; align-items: flex-end; padding: 20px; }
        .control-side { display: flex; align-items: flex-end; gap: 20px; pointer-events: auto; }
        .joystick { width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); position: relative; }
        .joy-btn { position: absolute; width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 18px; }
        .joy-btn:active { background: rgba(255,255,255,0.6); }
        .joy-up { top: 0; left: 40px; height: 35px; border-radius: 8px 8px 0 0; }
        .joy-down { bottom: 0; left: 40px; height: 35px; border-radius: 0 0 8px 8px; }
        .joy-left { top: 40px; left: 0; width: 35px; border-radius: 8px 0 0 8px; }
        .joy-right { top: 40px; right: 0; width: 35px; border-radius: 0 8px 8px 0; }
        .action-btns { display: grid; grid-template-columns: 60px 60px; grid-template-rows: 60px 60px; gap: 8px; }
        .act-btn { border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; color: #fff; border: 2px solid rgba(255,255,255,0.5); }
        .act-btn:active { transform: scale(0.95); }
        .btn-block { background: rgba(0, 150, 255, 0.6); grid-area: 1 / 1; }
        .btn-atk { background: rgba(255, 50, 50, 0.6); grid-area: 2 / 2; }
        .btn-ult { background: rgba(255, 215, 0, 0.6); grid-area: 1 / 2; color: #000; }
    </style>
</head>
<body>
    <div id="game-container">
        
        <!-- 开场动画层 -->
        <div id="intro-screen">
            <div class="stars"></div>
            <button class="skip-btn" id="skip-btn">跳过 >>></button>
            <div class="fade-text" id="intro-text">十五网页游戏</div>
            <div class="intro-img-group" id="intro-imgs">
                <img src="logo1.jpg" alt="Logo" onerror="this.style.display='none'">
                <img src="logo2.jpg" alt="鲸鱼" onerror="this.style.display='none'">
                <div class="intro-credit">本网页代码由DeepSeek辅助制作</div>
            </div>
        </div>

        <!-- 大厅主界面 -->
        <div id="menu-screen">
            <div class="menu-title">十五游戏大厅</div>
            <div class="menu-grid">
                <div class="menu-card active" onclick="App.openGame('fighting')">
                    <div class="card-icon">🥊</div>
                    <div class="card-title">十五格斗</div>
                    <div class="card-desc">双人同屏对战<br>绿幕抠图引擎</div>
                </div>
                <div class="menu-card locked">
                    <div class="lock-icon">🔒</div>
                    <div class="card-icon">🍬</div>
                    <div class="card-title">十五消消乐</div>
                    <div class="card-desc">敬请期待</div>
                </div>
                <div class="menu-card locked">
                    <div class="lock-icon">🔒</div>
                    <div class="card-icon">🃏</div>
                    <div class="card-title">十五斗地主</div>
                    <div class="card-desc">敬请期待</div>
                </div>
            </div>
        </div>

        <!-- 渲染画布 -->
        <canvas id="gameCanvas" width="1200" height="675"></canvas>

        <!-- 战斗 UI -->
        <div id="battle-ui">
            <div class="top-hud">
                <div class="hud-player">
                    <div class="hud-avatar" id="p1-hud-avatar"></div>
                    <div class="hud-bars">
                        <div class="hud-name" id="p1-hud-name">P1</div>
                        <div class="bar-container"><div class="bar-hp" id="p1-hud-hp"></div></div>
                        <div class="bar-container energy"><div class="bar-energy" id="p1-hud-energy"></div></div>
                    </div>
                </div>
                <div class="timer-box" id="timer-text">99</div>
                <div class="hud-player right">
                    <div class="hud-avatar" id="p2-hud-avatar"></div>
                    <div class="hud-bars">
                        <div class="hud-name" id="p2-hud-name">P2</div>
                        <div class="bar-container"><div class="bar-hp" id="p2-hud-hp"></div></div>
                        <div class="bar-container energy"><div class="bar-energy" id="p2-hud-energy"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 触屏按键 -->
        <div id="touch-controls">
            <div class="control-side">
                <div class="joystick">
                    <div class="joy-btn joy-up" data-key="KeyW">▲</div>
                    <div class="joy-btn joy-down" data-key="KeyS">▼</div>
                    <div class="joy-btn joy-left" data-key="KeyA">◀</div>
                    <div class="joy-btn joy-right" data-key="KeyD">▶</div>
                </div>
                <div class="action-btns">
                    <div class="act-btn btn-block" data-key="KeyS">防</div>
                    <div class="act-btn btn-atk" data-key="KeyJ">拍</div>
                    <div class="act-btn btn-ult" data-key="KeyK">必杀</div>
                </div>
            </div>
            <div class="control-side">
                <div class="action-btns">
                    <div class="act-btn btn-block" data-key="ArrowDown">防</div>
                    <div class="act-btn btn-atk" data-key="Numpad1">拍</div>
                    <div class="act-btn btn-ult" data-key="Numpad2">必杀</div>
                </div>
                <div class="joystick">
                    <div class="joy-btn joy-up" data-key="ArrowUp">▲</div>
                    <div class="joy-btn joy-down" data-key="ArrowDown">▼</div>
                    <div class="joy-btn joy-left" data-key="ArrowLeft">◀</div>
                    <div class="joy-btn joy-right" data-key="ArrowRight">▶</div>
                </div>
            </div>
        </div>

        <!-- 选人界面 -->
        <div id="select-screen">
            <div class="select-header">
                <h1>十五格斗</h1>
                <p>测试版 v2.2</p>
            </div>
            <div class="select-main">
                <div class="player-panel p1-active">
                    <div class="player-title p1-title">PLAYER 1</div>
                    <div class="char-selector">
                        <button class="nav-btn" onclick="UI.changeChar(1, -1)">◀</button>
                        <div class="char-name-badge" id="p1-name-badge">辣子鸡</div>
                        <button class="nav-btn" onclick="UI.changeChar(1, 1)">▶</button>
                    </div>
                    <div class="char-img-box" id="p1-img-box"></div>
                    <div class="stats-box" id="p1-stats"></div>
                    <div class="char-ult" id="p1-ult-text"></div>
                    <div class="char-desc" id="p1-desc"></div>
                </div>
                <div class="player-panel p2-active">
                    <div class="player-title p2-title">PLAYER 2</div>
                    <div class="char-selector">
                        <button class="nav-btn" onclick="UI.changeChar(2, -1)">◀</button>
                        <div class="char-name-badge" id="p2-name-badge">神秘雌性双马尾</div>
                        <button class="nav-btn" onclick="UI.changeChar(2, 1)">▶</button>
                    </div>
                    <div class="char-img-box" id="p2-img-box"></div>
                    <div class="stats-box" id="p2-stats"></div>
                    <div class="char-ult" id="p2-ult-text"></div>
                    <div class="char-desc" id="p2-desc"></div>
                </div>
            </div>
            <div class="select-footer">
                <button class="btn-action btn-back" onclick="App.backToMenu()">返回大厅</button>
                <button class="btn-action" onclick="UI.startGame()">开始战斗</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 流程控制与动画 App
        // ==========================================
        const App = {
            introTimers: [],
            
            init() {
                // 极速预加载
                preloadAssets();

                const introText = document.getElementById('intro-text');
                const introImgs = document.getElementById('intro-imgs');
                const skipBtn = document.getElementById('skip-btn');

                skipBtn.onclick = () => {
                    this.introTimers.forEach(clearTimeout);
                    this.enterMenu();
                };

                introText.classList.add('show');
                
                this.introTimers.push(setTimeout(() => {
                    introText.classList.remove('show');
                    
                    this.introTimers.push(setTimeout(() => {
                        introImgs.style.display = 'flex';
                        void introImgs.offsetWidth; 
                        introImgs.classList.add('show');
                        
                        this.introTimers.push(setTimeout(() => {
                            introImgs.classList.remove('show');
                            
                            this.introTimers.push(setTimeout(() => {
                                this.enterMenu();
                            }, 1000));
                        }, 4000));
                    }, 1000));
                }, 2000));
            },

            enterMenu() {
                const intro = document.getElementById('intro-screen');
                intro.classList.add('hide');
                
                setTimeout(() => {
                    intro.style.display = 'none';
                    const menu = document.getElementById('menu-screen');
                    menu.style.display = 'flex';
                    void menu.offsetWidth;
                    menu.classList.add('show');
                }, 1000); // 等动画播完
            },

            openGame(gameName) {
                if (gameName === 'fighting') {
                    const menu = document.getElementById('menu-screen');
                    menu.classList.remove('show');
                    
                    setTimeout(() => {
                        menu.style.display = 'none';
                        const select = document.getElementById('select-screen');
                        select.style.display = 'flex';
                        void select.offsetWidth;
                        select.classList.add('show');
                        UI.init();
                    }, 500);
                }
            },

            backToMenu() {
                document.getElementById('battle-ui').style.display = 'none';
                document.getElementById('touch-controls').style.display = 'none';
                document.getElementById('select-screen').classList.remove('show');
                
                setTimeout(() => {
                    document.getElementById('select-screen').style.display = 'none';
                    const menu = document.getElementById('menu-screen');
                    menu.style.display = 'flex';
                    void menu.offsetWidth;
                    menu.classList.add('show');
                }, 500);
                Game.isRunning = false; 
            }
        };

        // ==========================================
        // 游戏核心逻辑
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const CHARACTERS = [
            { id: 1, name: "辣子鸡", type: "力量型", color: "#ff4d4d", img: "char1.jpg", img_cut: "char1.png", stats: { power: 5, speed: 2, hp: 4 }, ultName: "曼巴冲撞", desc: "力量强，机动慢。冲刺撞击。", maxHp: 400, speed: 200, jump: -800, atkDmg: 30, ultCost: 100 },
            { id: 2, name: "迪客", type: "智慧型", color: "#4da6ff", img: "char2.jpg", img_cut: "char2.png", stats: { power: 2, speed: 3, hp: 3 }, ultName: "打电动", desc: "随时间变强。数据流束缚。", maxHp: 350, speed: 300, jump: -900, atkDmg: 15, ultCost: 100 },
            { id: 3, name: "黑色神秘生物", type: "敏捷型", color: "#333333", img: "char3.jpg", img_cut: "char3.png", stats: { power: 2, speed: 5, hp: 2 }, ultName: "大狗嚼嚼嚼", desc: "极速，硬控撕咬。", maxHp: 300, speed: 450, jump: -1000, atkDmg: 12, ultCost: 100 },
            { id: 4, name: "吕布", type: "力量型", color: "#cc0000", img: "char4.jpg", img_cut: "char4.png", stats: { power: 5, speed: 4, hp: 5 }, ultName: "方天画戟", desc: "极强，随时间减弱。丢画戟。", maxHp: 500, speed: 350, jump: -850, atkDmg: 40, ultCost: 100 },
            { id: 5, name: "神秘雌性双马尾", type: "精神型", color: "#ff99cc", img: "char5.jpg", img_cut: "char5.png", stats: { power: 1, speed: 1, hp: 1 }, ultName: "生理恐吓", desc: "大招耗能极低。硬控夺取属性。", maxHp: 250, speed: 180, jump: -700, atkDmg: 8, ultCost: 40 }
        ];

        const Assets = { images: {}, loaded: 0, total: 0 };
        
        // 🚀 降采样加速抠图引擎
        function chromaKeyGreenScreen(img) {
            const cvs = document.createElement('canvas');
            // 【核心优化】限制处理宽度最大为 300px，速度快 10 倍以上
            const MAX_WIDTH = 300;
            const scale = Math.min(1, MAX_WIDTH / img.naturalWidth);
            
            cvs.width = img.naturalWidth * scale;
            cvs.height = img.naturalHeight * scale;
            const c = cvs.getContext('2d');
            c.drawImage(img, 0, 0, cvs.width, cvs.height);
            
            const imgData = c.getImageData(0, 0, cvs.width, cvs.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i+1], b = data[i+2];
                if (g > r * 1.15 && g > b * 1.15 && g > 40) { data[i+3] = 0; }
                else if (g > r * 1.05 && g > b * 1.05) { data[i+3] = 128; }
            }
            c.putImageData(imgData, 0, 0);
            return cvs; 
        }

        function preloadAssets() {
            let urls = [];
            CHARACTERS.forEach(c => { urls.push(c.img); urls.push(c.img_cut); });
            Assets.total = urls.length;
            urls.forEach(url => {
                let img = new Image();
                img.src = url;
                img.onload = () => {
                    if (url.endsWith('.png')) Assets.images[url] = chromaKeyGreenScreen(img);
                    else Assets.images[url] = img;
                    Assets.loaded++;
                };
                img.onerror = () => { Assets.loaded++; };
            });
        }

        const Input = {
            keys: {},
            init() {
                window.addEventListener('keydown', e => this.keys[e.code] = true);
                window.addEventListener('keyup', e => this.keys[e.code] = false);
                document.querySelectorAll('[data-key]').forEach(btn => {
                    const code = btn.getAttribute('data-key');
                    const press = (e) => { e.preventDefault(); this.keys[code] = true; };
                    const release = (e) => { e.preventDefault(); this.keys[code] = false; };
                    btn.addEventListener('pointerdown', press);
                    btn.addEventListener('pointerup', release);
                    btn.addEventListener('pointercancel', release);
                    btn.addEventListener('pointerleave', release);
                });
            },
            isDown(code) { return !!this.keys[code]; }
        };
        Input.init();

        const STATE = { IDLE: 0, WALK: 1, JUMP: 2, BLOCK: 3, HIT: 4, ATTACK: 5, DEAD: 6, STUNNED: 7 };

        const Particles = {
            list: [], spawn(x, y, color, count = 5) { for(let i=0; i<count; i++) { this.list.push({ x: x, y: y, vx: (Math.random() - 0.5) * 800, vy: (Math.random() - 0.5) * 800, life: 1, color: color }); } },
            update() { for(let i = this.list.length - 1; i >= 0; i--) { let p = this.list[i]; p.x += p.vx / 60; p.y += p.vy / 60; p.life -= 0.05; if(p.life <= 0) this.list.splice(i, 1); } },
            render(ctx) { this.list.forEach(p => { ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fillRect(p.x, p.y, 6, 6); }); ctx.globalAlpha = 1; }
        };

        class Projectile {
            constructor(x, y, vx, owner, type) { this.x = x; this.y = y; this.vx = vx; this.owner = owner; this.type = type; this.width = type === 'halberd' ? 80 : 50; this.height = type === 'halberd' ? 30 : 50; this.active = true; this.life = 120; this.angle = 0; }
            update() { this.x += this.vx / 60; this.life--; this.angle += 0.2; if (this.life <= 0 || this.x < 0 || this.x > canvas.width) this.active = false; }
            getHurtbox() { return { x: this.x - this.width/2, y: this.y - this.height/2, w: this.width, h: this.height }; }
        }

        class Fighter {
            constructor(isP1, charId) {
                this.isP1 = isP1; this.config = CHARACTERS.find(c => c.id === charId);
                this.x = isP1 ? 350 : 850; this.y = 550; this.vx = 0; this.vy = 0; 
                // 🚀 调整体型：加宽了一点，让打击判定更宽泛
                this.width = 120; this.height = 160; this.facing = isP1 ? 1 : -1;
                this.maxHp = this.config.maxHp; this.hp = this.maxHp; this.energy = 0; this.maxEnergy = this.config.ultCost;
                this.state = STATE.IDLE; this.stateTimer = 0; this.hitstop = 0; this.currentAtk = this.config.atkDmg; this.currentSpeed = this.config.speed; this.currentJump = this.config.jump; 
                this.matchTime = 0; this.stunTimer = 0; this.autoAttackTimer = 0; this.buffTickTimer = 0; this.hasHitThisAttack = false; this.attackData = null; this.isUltInterrupted = false; 
                this.flashTimer = 0; this.breathTime = Math.random() * 10; this.yOffset = 0; this.trail = [];
            }
            update() {
                if (this.state === STATE.DEAD) return;
                if (this.hitstop > 0) { this.hitstop--; return; }
                this.matchTime++; this.handlePassiveSkills(); if (this.flashTimer > 0) this.flashTimer--; this.breathTime += 0.1;
                if (this.state === STATE.STUNNED) { this.stunTimer--; this.vx = 0; if (this.stunTimer <= 0) this.changeState(STATE.IDLE); return; }
                if (this.autoAttackTimer > 0) { this.autoAttackTimer--; if (this.autoAttackTimer <= 0) this.changeState(STATE.IDLE); return; }
                this.vy += 2500 / 60; this.y += this.vy / 60; if (this.y >= 550) { this.y = 550; this.vy = 0; if (this.state === STATE.JUMP) this.changeState(STATE.IDLE); }
                if (this.state !== STATE.HIT && this.state !== STATE.ATTACK) this.handleInput(); this.handleStateLogic();
                this.x += this.vx / 60; if (this.x < 80) this.x = 80; if (this.x > canvas.width - 80) this.x = canvas.width - 80;
                if (this.state === STATE.IDLE) this.yOffset = Math.sin(this.breathTime) * 3; else if (this.state === STATE.BLOCK) this.yOffset = 2; else this.yOffset = 0;
                if (Math.abs(this.vx) > 300 || this.state === STATE.JUMP) { this.trail.unshift({ x: this.x, y: this.y, facing: this.facing }); if (this.trail.length > 5) this.trail.pop(); } else { if(this.trail.length > 0) this.trail.pop(); }
            }
            handlePassiveSkills() {
                if (this.config.id === 2) this.currentAtk = this.config.atkDmg + Math.floor(this.matchTime / 120);
                if (this.config.id === 3) { const decay = Math.floor(this.matchTime / 240); this.currentSpeed = Math.max(150, this.config.speed - decay * 40); this.currentAtk = this.config.atkDmg + decay * 5; }
                if (this.config.id === 4) { this.buffTickTimer++; if (this.buffTickTimer >= 600) { this.buffTickTimer = 0; this.currentAtk *= 0.85; this.currentSpeed *= 0.85; this.currentJump = Math.max(-400, this.currentJump * 0.90); } }
            }
            handleInput() {
                const p1 = this.isP1; const left = p1 ? Input.isDown('KeyA') : Input.isDown('ArrowLeft'); const right = p1 ? Input.isDown('KeyD') : Input.isDown('ArrowRight'); const up = p1 ? Input.isDown('KeyW') : Input.isDown('ArrowUp'); const down = p1 ? Input.isDown('KeyS') : Input.isDown('ArrowDown'); const atk = p1 ? Input.isDown('KeyJ') : Input.isDown('Numpad1'); const ult = p1 ? Input.isDown('KeyK') : Input.isDown('Numpad2');
                if (down && this.y >= 550) { this.changeState(STATE.BLOCK); this.vx = 0; return; } if (atk) { this.startAttack(false); return; } if (ult && this.energy >= this.maxEnergy && this.state !== STATE.ATTACK) { this.energy = 0; this.startAttack(true); return; }
                if (this.state !== STATE.JUMP) { if (up) { this.vy = this.currentJump; this.changeState(STATE.JUMP); } else if (left) { this.vx = -this.currentSpeed; this.facing = -1; this.changeState(STATE.WALK); } else if (right) { this.vx = this.currentSpeed; this.facing = 1; this.changeState(STATE.WALK); } else { this.vx = 0; this.changeState(STATE.IDLE); } }
            }
            startAttack(isUltimate) {
                this.changeState(STATE.ATTACK); this.hasHitThisAttack = false; this.isUltInterrupted = false; this.attackData = { dmg: this.currentAtk, isUlt: isUltimate };
                if (isUltimate) {
                    switch(this.config.id) {
                        case 1: this.vx = this.facing * 800; this.stateTimer = 30; break;
                        case 2: Game.projectiles.push(new Projectile(this.x, this.y - 80, this.facing * 700, this, 'data')); this.stateTimer = 40; this.vx = 0; break;
                        case 3: Game.triggerGlobalStun(this); this.stateTimer = 40; this.vx = 0; break;
                        case 4: Game.projectiles.push(new Projectile(this.x, this.y - 80, this.facing * 900, this, 'halberd')); this.stateTimer = 40; this.vx = 0; break;
                        case 5: this.stateTimer = 35; this.vx = 0; break;
                    }
                } else { this.stateTimer = 15; this.vx = 0; }
            }
            handleStateLogic() {
                if (this.state === STATE.HIT) { this.vx *= 0.8; if (--this.stateTimer <= 0) this.changeState(STATE.IDLE); }
                if (this.state === STATE.ATTACK) { if (this.config.id === 5 && this.attackData?.isUlt && this.stateTimer === 10 && !this.isUltInterrupted) Game.triggerFearEffect(this); if (--this.stateTimer <= 0) { if (this.config.id === 1 && this.attackData.isUlt) this.vx = 0; this.attackData = null; this.changeState(STATE.IDLE); } }
            }
            changeState(s) { this.state = s; if (s === STATE.ATTACK) return; this.stateTimer = s === STATE.HIT ? 20 : 0; }
            getHurtbox() { return { x: this.x - this.width/2, y: this.y - this.height + this.yOffset, w: this.width, h: this.height }; }
            getHitbox() {
                if (this.state !== STATE.ATTACK || !this.attackData || this.stateTimer < 5 || this.config.id === 5) return null;
                if (this.config.id === 1 && this.attackData.isUlt) return { x: this.facing === 1 ? this.x : this.x - 160, y: this.y - 160, w: 160, h: 160 };
                let range = this.attackData.isUlt ? 160 : 130; return { x: this.facing === 1 ? this.x : this.x - range, y: this.y - 140, w: range, h: 120 };
            }
            receiveHit(attacker, attackData, type = "normal") {
                if (this.state === STATE.DEAD) return;
                if (this.config.id === 5 && this.state === STATE.ATTACK && this.attackData?.isUlt && this.stateTimer > 10) { this.isUltInterrupted = true; this.changeState(STATE.HIT); this.stateTimer = 30; this.vx = attacker.facing * 400; this.hitstop = 10; attacker.hitstop = 10; this.flashTimer = 10; return; }
                if (type === "halberd") this.hp -= this.maxHp * 0.20; else if (this.state === STATE.BLOCK) this.hp -= attackData.dmg * 0.2; else this.hp -= attackData.dmg;
                this.energy = Math.min(this.maxEnergy, this.energy + 15); this.hitstop = 6; attacker.hitstop = 6; this.flashTimer = 6; 
                if (this.hp <= 0) { this.hp = 0; this.changeState(STATE.DEAD); return; }
                if (this.state !== STATE.BLOCK) { this.changeState(STATE.HIT); this.vx = attacker.facing * 300; }
            }
            applyStun(frames) { this.changeState(STATE.STUNNED); this.stunTimer = frames; }
            render() {
                this.trail.forEach((t, i) => { ctx.globalAlpha = 0.2 * (i / this.trail.length); this.drawBody(t.x, t.y, t.facing, true); }); ctx.globalAlpha = 1;
                if (this.flashTimer > 0) ctx.filter = 'brightness(3) grayscale(1)'; else ctx.filter = 'none';
                this.drawBody(this.x, this.y + this.yOffset, this.facing, false); ctx.filter = 'none';
                if (this.state === STATE.BLOCK) {
                    ctx.save(); ctx.translate(this.x + this.facing * 60, this.y + this.yOffset - 80); ctx.beginPath(); ctx.arc(0, 0, 90, -Math.PI/2, Math.PI/2, this.facing === -1);
                    let shieldAlpha = 0.5 + Math.sin(Date.now() / 150) * 0.2; ctx.strokeStyle = `rgba(0, 200, 255, ${shieldAlpha})`; ctx.lineWidth = 6; ctx.shadowBlur = 20; ctx.shadowColor = '#00ffff'; ctx.stroke();
                    ctx.fillStyle = `rgba(0, 200, 255, 0.15)`; ctx.fill(); ctx.restore();
                }
                if (this.state === STATE.ATTACK) { const hit = this.getHitbox(); if (hit) { ctx.strokeStyle = 'red'; ctx.lineWidth = 2; ctx.strokeRect(hit.x, hit.y, hit.w, hit.h); } }
            }
            drawBody(x, y, facing, isGhost) {
                const hurt = this.getHurtbox(); 
                const img = Assets.images[this.config.img_cut];
                
                if (img && img.height > 0) {
                    ctx.save(); ctx.translate(x, y);
                    let scaleX = 1, scaleY = 1;
                    if (!isGhost) { if (this.state === STATE.ATTACK) { scaleX = 1.1; scaleY = 0.9; } if (this.state === STATE.HIT) { scaleX = 1.2; scaleY = 0.8; } if (this.state === STATE.JUMP) { scaleX = 0.9; scaleY = 1.1; } }
                    ctx.scale(facing * scaleX, scaleY); 
                    
                    // 🚀 修复变扁：自适应等比缩放
                    const ratio = img.height / img.width;
                    let drawW = hurt.w;
                    let drawH = hurt.w * ratio; 
                    if (drawH > hurt.h) { // 如果按宽度算太高，则按高度算
                        drawH = hurt.h;
                        drawW = hurt.h / ratio;
                    }
                    
                    // 将人物底部对齐脚底，并居中
                    ctx.drawImage(img, -drawW/2, -drawH, drawW, drawH); 
                    ctx.restore();
                } else {
                    ctx.fillStyle = this.config.color; ctx.fillRect(x - hurt.w/2, y - hurt.h, hurt.w, hurt.h);
                }
            }
        }

        const Game = {
            p1: null, p2: null, projectiles: [], isRunning: false, matchOver: false, shakeTimer: 0, timeLeft: 99, frameTimer: 0, 
            init(c1, c2) {
                this.p1 = new Fighter(true, c1); this.p2 = new Fighter(false, c2); this.projectiles = []; this.isRunning = true; this.matchOver = false; this.shakeTimer = 0; this.timeLeft = 99; this.frameTimer = 0;
                document.getElementById('timer-text').innerText = this.timeLeft;
                document.getElementById('battle-ui').style.display = 'block'; document.getElementById('touch-controls').style.display = 'flex';
                document.getElementById('p1-hud-name').innerText = this.p1.config.name; document.getElementById('p2-hud-name').innerText = this.p2.config.name;
                document.getElementById('p1-hud-avatar').innerHTML = `<img src="${this.p1.config.img}">`; document.getElementById('p2-hud-avatar').innerHTML = `<img src="${this.p2.config.img}">`;
            },
            updateUI() {
                if(!this.p1 || !this.p2) return;
                document.getElementById('p1-hud-hp').style.width = Math.max(0, (this.p1.hp / this.p1.maxHp) * 100) + '%'; document.getElementById('p2-hud-hp').style.width = Math.max(0, (this.p2.hp / this.p2.maxHp) * 100) + '%';
                document.getElementById('p1-hud-energy').style.width = (this.p1.energy / this.p1.maxEnergy) * 100 + '%'; document.getElementById('p2-hud-energy').style.width = (this.p2.energy / this.p2.maxEnergy) * 100 + '%';
            },
            triggerFearEffect(caster) {
                const target = caster.isP1 ? this.p2 : this.p1; if (target.state === STATE.DEAD) return;
                target.applyStun(60); let drain = 20; target.hp = Math.max(0, target.hp - drain); caster.hp = Math.min(caster.maxHp, caster.hp + drain);
                target.currentAtk = Math.max(1, target.currentAtk - 2); target.currentSpeed = Math.max(50, target.currentSpeed - 15);
                caster.currentAtk += 2; caster.currentSpeed += 15; target.hitstop = 10; caster.hitstop = 10; target.flashTimer = 10; if (target.hp <= 0) { target.hp = 0; target.changeState(STATE.DEAD); }
            },
            triggerGlobalStun(attacker) {
                const target = attacker.isP1 ? this.p2 : this.p1;
                if (Math.abs(attacker.x - target.x) < 250) { target.applyStun(60); target.autoAttackTimer = 60; target.hp -= 20; target.flashTimer = 10; }
            },
            tick() {
                if (!this.isRunning || this.matchOver) return;
                if (this.shakeTimer > 0) this.shakeTimer--;
                this.frameTimer++; if (this.frameTimer >= 60) { this.frameTimer = 0; this.timeLeft--; document.getElementById('timer-text').innerText = this.timeLeft; if (this.timeLeft <= 0) { this.matchOver = true; let winner = this.p1.hp > this.p2.hp ? "1P" : (this.p2.hp > this.p1.hp ? "2P" : "平局"); setTimeout(() => { alert(`时间到！${winner} 获胜!`); App.backToMenu(); }, 100); return; } }
                this.p1.update(); this.p2.update(); this.projectiles.forEach(p => p.update()); this.projectiles = this.projectiles.filter(p => p.active); Particles.update();
                this.checkCombat(this.p1, this.p2); this.checkCombat(this.p2, this.p1);
                this.projectiles.forEach(p => {
                    const target = p.owner === this.p1 ? this.p2 : this.p1;
                    if (this.checkAABB(p.getHurtbox(), target.getHurtbox())) {
                        p.active = false; if (p.type === 'data') { target.applyStun(120); target.hp -= 10; target.flashTimer = 10; } else if (p.type === 'halberd') target.receiveHit(p.owner, { dmg: 0 }, "halberd");
                        Particles.spawn(p.x, p.y, '#fff', 10); this.shakeTimer = 5;
                    }
                });
                this.updateUI();
                if (this.p1.hp <= 0 || this.p2.hp <= 0) { this.matchOver = true; setTimeout(() => { alert(`${this.p1.hp <= 0 ? '2P' : '1P'} 胜利!`); App.backToMenu(); }, 100); }
            },
            checkCombat(attacker, target) {
                const hit = attacker.getHitbox(); const hurt = target.getHurtbox();
                if (hit && !attacker.hasHitThisAttack && this.checkAABB(hit, hurt)) { attacker.hasHitThisAttack = true; target.receiveHit(attacker, attacker.attackData); Particles.spawn((attacker.x + target.x)/2, target.y - 80, target.state === STATE.BLOCK ? '#00ffff' : '#ff0000', 15); this.shakeTimer = target.state === STATE.BLOCK ? 3 : 8; }
            },
            checkAABB(r1, r2) { return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y; },
            render() {
                ctx.save();
                if (this.shakeTimer > 0) { let dx = (Math.random() - 0.5) * this.shakeTimer * 2; let dy = (Math.random() - 0.5) * this.shakeTimer * 2; ctx.translate(dx, dy); }
                let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height); bgGrad.addColorStop(0, '#1a1a2e'); bgGrad.addColorStop(1, '#0f0f1b'); ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#222'; ctx.fillRect(0, 550, canvas.width, 125); ctx.strokeStyle = '#444'; ctx.lineWidth = 2; for(let i=0; i<canvas.width; i+=100) { ctx.beginPath(); ctx.moveTo(i, 550); ctx.lineTo(i-100, 675); ctx.stroke(); }
                if (this.isRunning) {
                    this.p1.render(); this.p2.render();
                    this.projectiles.forEach(p => { ctx.save(); ctx.translate(p.x, p.y); if(p.type === 'halberd') ctx.rotate(p.angle); ctx.fillStyle = p.type === 'data' ? '#00ffff' : '#ffaa00'; ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle; const h = p.getHurtbox(); ctx.fillRect(-h.w/2, -h.h/2, h.w, h.h); ctx.restore(); });
                    Particles.render(ctx);
                }
                ctx.restore();
            }
        };

        const UI = {
            p1Index: 0, p2Index: 4,
            init() { this.updateShowcases(); },
            changeChar(player, dir) { if (player === 1) this.p1Index = (this.p1Index + dir + CHARACTERS.length) % CHARACTERS.length; else this.p2Index = (this.p2Index + dir + CHARACTERS.length) % CHARACTERS.length; this.updateShowcases(); },
            updateShowcases() {
                const c1 = CHARACTERS[this.p1Index];
                document.getElementById('p1-name-badge').innerText = c1.name; document.getElementById('p1-name-badge').style.background = c1.color;
                document.getElementById('p1-img-box').innerHTML = `<img src="${c1.img}" onerror="this.style.display='none'; this.parentElement.style.background='${c1.color}'">`;
                document.getElementById('p1-stats').innerHTML = this.getStatsHTML(c1); document.getElementById('p1-ult-text').innerText = `必杀「${c1.ultName}」`; document.getElementById('p1-desc').innerText = c1.desc;
                
                const c2 = CHARACTERS[this.p2Index];
                document.getElementById('p2-name-badge').innerText = c2.name; document.getElementById('p2-name-badge').style.background = c2.color;
                document.getElementById('p2-img-box').innerHTML = `<img src="${c2.img}" onerror="this.style.display='none'; this.parentElement.style.background='${c2.color}'">`;
                document.getElementById('p2-stats').innerHTML = this.getStatsHTML(c2); document.getElementById('p2-ult-text').innerText = `必杀「${c2.ultName}」`; document.getElementById('p2-desc').innerText = c2.desc;
            },
            getStatsHTML(c) {
                let html = '';
                html += `<div class="stat-row"><div class="stat-label">速度</div><div class="stat-bar">`; for(let i=1; i<=5; i++) html += `<div class="stat-seg ${i <= c.stats.speed ? 'active' : ''}"></div>`; html += `</div></div>`;
                html += `<div class="stat-row"><div class="stat-label">力量</div><div class="stat-bar">`; for(let i=1; i<=5; i++) html += `<div class="stat-seg ${i <= c.stats.power ? 'active power' : ''}"></div>`; html += `</div></div>`;
                html += `<div class="stat-row"><div class="stat-label">体力</div><div class="stat-bar">`; for(let i=1; i<=5; i++) html += `<div class="stat-seg ${i <= c.stats.hp ? 'active hp' : ''}"></div>`; html += `</div></div>`;
                return html;
            },
            startGame() {
                document.getElementById('select-screen').classList.remove('show');
                setTimeout(() => {
                    document.getElementById('select-screen').style.display = 'none';
                    Game.init(CHARACTERS[this.p1Index].id, CHARACTERS[this.p2Index].id);
                }, 500);
            }
        };

        let acc = 0, lastTime = performance.now();
        function loop(time) {
            const dt = (time - lastTime) / 1000; lastTime = time;
            if (Game.isRunning && !Game.matchOver) { acc += dt; while (acc >= 1/60) { Game.tick(); acc -= 1/60; } }
            Game.render();
            requestAnimationFrame(loop);
        }

        // 网页入口：启动流程
        App.init();
        requestAnimationFrame(loop);
    </script>
